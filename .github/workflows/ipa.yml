name: Unsigned IPA

# Builds an unsigned BetterWispr.ipa for sideloading services (such as Signulous) that sign it with their own certificate.
# Run it from the Actions tab, or it runs on every push to main that touches the iOS app or shared library.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["iOS/**", "Sources/BetterWisprCore/**", "Package.swift", "Package.resolved", ".github/workflows/ipa.yml"]

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          brew install xcodegen
      - name: Build for iPhone without signing
        run: |
          cd iOS
          xcodegen generate
          status=0
          xcodebuild -project BetterWisprMobile.xcodeproj -scheme BetterWisprMobile -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          found=$(grep -E "error:" build.log | sort -u | head -80 || true)
          if [ -n "$found" ]; then echo "::error title=build.log::$(printf '%s' "$found" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')"; fi
          exit $status
      - name: Package the IPA
        run: |
          cd iOS
          app=build/Build/Products/Release-iphoneos/BetterWisprMobile.app
          test -d "$app/PlugIns/BetterWisprKeyboard.appex" || { echo "::error::The keyboard extension is missing from the app"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../BetterWispr-unsigned.ipa Payload)
          size=$(du -h BetterWispr-unsigned.ipa | cut -f1)
          echo "::notice title=ipa::BetterWispr-unsigned.ipa built ($size) from ${GITHUB_SHA::7}, includes the keyboard extension"
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWispr-unsigned-ipa
          path: iOS/BetterWispr-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
